services:
  - type: web
    name: zyra
    runtime: docker
    plan: starter # disco persistente exige plano pago no Render
    healthCheckPath: /api/health
    envVars:
      - key: ZYRA_DATA_DIR
        value: /data
      - key: ZYRA_SEED
        value: "0"
      - key: ZYRA_USER
        value: zyra
      - key: ZYRA_PASSWORD
        sync: false # defina no dashboard (nunca no git)
    disk:
      name: zyra-data
      mountPath: /data
      sizeGB: 1
